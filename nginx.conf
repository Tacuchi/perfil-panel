server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Una sola pantalla: cualquier ruta sirve la app. /api la enruta el proxy a la API antes de llegar aquí.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Archivos con huella en el nombre: su contenido no cambia nunca.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
