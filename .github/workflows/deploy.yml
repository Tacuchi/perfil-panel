# Cualquier push que no sea solo de documentación → pruebas y build. Solo en main → imagen linux/amd64 con etiqueta inmutable (git SHA) en GHCR
# → redeploy en Coolify. Mismo patrón que developer-portfolio.
# Secrets requeridos en GitHub: COOLIFY_TOKEN · COOLIFY_APP_UUID.
name: deploy

on:
  push:
    # Un cambio solo de documentación no corre las pruebas ni redespliega.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tacuchi/perfil-panel
  COOLIFY_URL: https://coolify.tacuchi.net

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Sin secrets de Coolify → pruebas e imagen corren y el deploy se salta (run verde).
      HAS_COOLIFY: ${{ secrets.COOLIFY_TOKEN != '' && secrets.COOLIFY_APP_UUID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy en Coolify (etiqueta inmutable)
        if: env.HAS_COOLIFY == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"docker_registry_image_tag": "${{ github.sha }}"}'
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"$APP_UUID\"}"
